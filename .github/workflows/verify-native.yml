name: Verify sealed candidate on native systems
on: workflow_dispatch
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: KALIBATAKU native checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install jsonschema
      - run: python tools/native_receipt.py "../native-${RUNNER_OS}"
        working-directory: KALIBATAKU native checkout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ runner.os }}
          path: ${{ github.workspace }}/native-${{ runner.os }}
